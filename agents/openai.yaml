interface:
  display_name: "Classical Astrology Consultation"
  short_description: "Evidence-first natal consultation with direct classical and optional modern-evolutionary renderers"
  default_prompt: "Use $classical-astrology-consultation. Run the canonical module dispatch first: local Chart Facts, planetary state, responsibility chain, reception audit, bounded topic knowledge and composition. For architecture or rule changes, run scripts/run_quality_gate.py before handoff. Default to classical-direct: independently read the natal chart first, map the topic through houses and rulers, grade evidence, state favorable/mixed/strained judgments plainly, and add practical limits. If the user requests modern/evolutionary/委婉 wording, render the same validated judgment without astrological symbols."
policy:
